<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unrailed 2 — Build Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#171c27;--bg2:#1f2634;--panel-edge:#3d2f1d;--wood:#7a5a36;
  --rail:#ff7a3d;--rail-deep:#e0562a;--teal:#39c2a8;--green:#5fd07a;
  --blue:#5aa9ff;--gold:#ffce4a;--cream:#f6ecd9;--muted:#9aa3b2;
  --slot:#222a3a;--slot-edge:#374255;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:'M PLUS Rounded 1c',system-ui,sans-serif;
  background:radial-gradient(1200px 600px at 75% -10%, #243049 0%, transparent 60%),
    radial-gradient(900px 500px at 0% 110%, #2a1c16 0%, transparent 55%),var(--bg);
  color:var(--cream);display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased;
}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 22px;
  border-bottom:2px solid rgba(255,255,255,.06);background:linear-gradient(180deg, rgba(255,255,255,.04), transparent);}
.brand{display:flex;flex-direction:column;line-height:1}
.brand .t{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:26px;letter-spacing:.5px}
.brand .t .accent{color:var(--rail)}
.brand .s{font-size:12px;color:var(--muted);margin-top:3px;font-weight:500}
.spacer{flex:1}
.btn{font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;border:none;border-radius:11px;
  padding:9px 14px;color:var(--cream);background:#313b4f;border-bottom:3px solid #222a3a;transition:.12s;}
.btn:hover{transform:translateY(-1px);filter:brightness(1.12)}
.btn:active{transform:translateY(1px);border-bottom-width:1px}
.btn.ghost{background:transparent;border:2px solid var(--slot-edge);border-bottom-width:2px;color:var(--muted)}
.btn.ghost.on{color:var(--gold);border-color:var(--gold)}
.engsel{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.25);padding:6px 8px;border-radius:14px}
.engsel .lab{font-size:11px;color:var(--muted);font-weight:700}
.engopt{width:54px;height:40px;border-radius:9px;cursor:pointer;border:2px solid transparent;
  display:flex;align-items:center;justify-content:center;overflow:hidden;background:rgba(255,255,255,.04);position:relative}
.engopt img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.engopt.on{border-color:var(--gold);background:rgba(255,206,74,.12)}
.engopt .free{position:absolute;bottom:-1px;right:1px;font-size:8px;color:var(--gold);font-weight:800}

main{flex:1;display:flex;flex-direction:column;min-height:0}
.stage-wrap{flex:1;overflow-x:auto;overflow-y:hidden;padding:8px 0 4px}
.stage{position:relative;min-width:max-content;padding:0 28px}
.arrow-layer{position:relative;width:100%;height:150px;pointer-events:none}
.arrow-layer svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

.train{display:flex;align-items:flex-start;gap:0}
/* engine */
.engine-cell{display:flex;flex-direction:column;align-items:center;width:160px;flex:0 0 auto;margin:0 6px}
.engine-cell .epad{height:128px;display:flex;align-items:flex-end;justify-content:center;width:100%;position:relative}
.engine-cell img{width:150px;object-fit:contain;filter:drop-shadow(0 6px 5px rgba(0,0,0,.5))}
.engine-cell .cap{font-size:11px;color:var(--muted);font-weight:700;margin-top:4px;text-align:center}
.engine-cell .cap .front{color:var(--gold)}
.mover{display:flex;gap:5px;margin-top:5px}
.mover button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;width:30px;height:26px;font-weight:800;
  background:var(--gold);color:#2a1402;border-bottom:2px solid #c8932f}
.mover button:disabled{opacity:.3;cursor:default}
.mover.hidden{visibility:hidden}

.wagon-cell{width:118px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center}
.wbox{width:112px;height:108px;border-radius:14px;cursor:pointer;position:relative;display:flex;align-items:flex-end;
  justify-content:center;background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,.18));
  border:2px dashed var(--slot-edge);transition:.12s;}
.wbox.filled{border-style:solid;border-color:transparent;background:radial-gradient(80px 60px at 50% 70%, rgba(255,255,255,.06), transparent)}
.wbox:hover{border-color:var(--rail);background:rgba(255,122,61,.07)}
.wbox.sel{border-color:var(--gold)!important;box-shadow:0 0 0 3px rgba(255,206,74,.25)}
.wbox img{max-width:104px;max-height:96px;object-fit:contain;filter:drop-shadow(0 5px 4px rgba(0,0,0,.45));pointer-events:none}
.wbox .idx{position:absolute;top:4px;left:7px;font-size:10px;font-weight:800;color:var(--muted);opacity:.7}
.wbox .empty-hint{font-size:24px;color:var(--slot-edge);font-weight:800;align-self:center;margin-bottom:34px}
.wname{font-size:10.5px;font-weight:700;color:var(--cream);height:14px;margin-top:3px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:112px;opacity:.85}
.coupler{width:8px;height:6px;background:var(--wood);align-self:center;margin-top:50px;border-radius:2px;flex:0 0 auto}

.ext-row{display:flex;gap:5px;margin-top:7px}
.ext-slot{width:32px;height:32px;border-radius:9px;cursor:pointer;position:relative;background:rgba(0,0,0,.28);
  border:2px dashed var(--slot-edge);display:flex;align-items:center;justify-content:center;transition:.1s;}
.ext-slot:hover{border-color:var(--teal)}
.ext-slot.sel{border-color:var(--gold)!important;box-shadow:0 0 0 2px rgba(255,206,74,.3)}
.ext-slot.filled{border-style:solid}
.ext-slot img{width:26px;height:26px;object-fit:contain}
.ext-slot.disabled{opacity:.25;pointer-events:none}

.palette{background:linear-gradient(180deg,#241b10,#1c150c);border-top:3px solid var(--panel-edge);padding:10px 18px 14px;}
.brush-bar{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.brush-now{display:flex;align-items:center;gap:9px;background:rgba(0,0,0,.3);padding:6px 12px;border-radius:12px;min-height:42px}
.brush-now .k{font-size:11px;color:var(--muted);font-weight:700}
.brush-chip{display:flex;align-items:center;gap:7px;font-weight:800;font-size:14px}
.brush-chip .sw{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06)}
.brush-chip img{max-width:26px;max-height:24px}
.hint{font-size:12px;color:var(--muted);font-weight:500}
.tabs{display:flex;gap:6px;margin-bottom:9px}
.tab{font-weight:800;font-size:13px;padding:6px 14px;border-radius:10px 10px 0 0;cursor:pointer;color:var(--muted);background:rgba(255,255,255,.03)}
.tab.on{color:#2a1402;background:var(--gold)}
.tray{display:flex;gap:7px;overflow-x:auto;padding:4px 2px 6px}
.pal-item{flex:0 0 auto;width:74px;height:74px;border-radius:12px;cursor:pointer;position:relative;
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.2));border:2px solid transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.1s;}
.pal-item:hover{border-color:var(--rail);transform:translateY(-2px)}
.pal-item.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,206,74,.3)}
.pal-item img{max-width:62px;max-height:48px;object-fit:contain;filter:drop-shadow(0 3px 2px rgba(0,0,0,.4))}
.pal-item .pn{position:absolute;bottom:2px;font-size:8.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.pal-item .flow{position:absolute;top:3px;right:4px;font-size:9px}
.pal-item.eraser{background:repeating-linear-gradient(45deg,#3a2f22,#3a2f22 6px,#2c2318 6px,#2c2318 12px)}
.pal-item.eraser svg{width:30px;height:30px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:6px;align-items:center}
.legend .it{display:flex;align-items:center;gap:6px;font-weight:600}
.legend .ln{width:22px;height:0;border-top:3px solid}
.tray::-webkit-scrollbar,.stage-wrap::-webkit-scrollbar{height:10px}
.tray::-webkit-scrollbar-thumb,.stage-wrap::-webkit-scrollbar-thumb{background:#43505f;border-radius:6px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="t">Unrailed<span class="accent">2</span> · Build Editor</div>
    <div class="s">ビルド編集 & 資材移動の視覚化ツール ／ 右が先頭（front）</div>
  </div>
  <div class="spacer"></div>
  <div class="engsel" id="engsel"><span class="lab">ENGINE</span></div>
  <button class="btn ghost on" id="animBtn">▶ 動き / Flow</button>
  <button class="btn ghost" id="labelBtn">ラベル</button>
  <button class="btn" id="exportBtn">⤓ Save</button>
  <button class="btn" id="importBtn">⤒ Load</button>
  <button class="btn" id="clearBtn">Clear</button>
  <input type="file" id="fileIn" accept="application/json" style="display:none">
</header>
<main>
  <div class="stage-wrap"><div class="stage">
    <div class="arrow-layer"><svg id="arrowSvg" preserveAspectRatio="none"></svg></div>
    <div class="train" id="train"></div>
  </div></div>
  <div class="palette">
    <div class="brush-bar">
      <div class="brush-now"><span class="k">選択中 / Brush:</span>
        <span class="brush-chip" id="brushChip"><span class="hint">パレットから選ぶ → スロットをクリック</span></span></div>
      <span class="hint">ブラシを選んでスロットをクリックして配置。消しゴムで削除。Pusher は ◀▶ で移動。</span>
    </div>
    <div class="tabs">
      <div class="tab on" data-tab="wagon">🚃 ワゴン / Wagons</div>
      <div class="tab" data-tab="ext">⚙ 拡張 / Expansions</div>
    </div>
    <div class="tray" id="tray"></div>
    <div class="legend">
      <span class="it"><span class="ln" style="border-color:var(--green)"></span> storage-pull（最寄り貨物→獲得）</span>
      <span class="it"><span class="ln" style="border-color:var(--rail)"></span> storage-push（最寄り貨物へ送出）</span>
      <span class="it"><span class="ln" style="border-color:var(--blue)"></span> front-pull（前方＝右のワゴンから）</span>
      <span class="it"><span class="ln" style="border-color:var(--gold);border-top-style:dashed"></span> 両矢印（双方向は1本に統合）</span>
      <span class="it">⚡ = 資材が動く拡張</span>
    </div>
  </div>
</main>

const WAGON_LABELS={'01_storage':'Storage','02_collector':'Collector','03_conveyor':'Conveyor','04_mag':'Magnet','05_cannon':'Cannon','06_carriage':'Carriage','07_crafter':'Crafter','08_transformer':'Transformer','09_slot':'Slot','10_dynamite':'Dynamite','11_miner':'Miner','12_torpedo':'Torpedo','13_turret':'Turret','14_brake':'Brake','15_ghost':'Ghost','16_tank':'Tank','17_supercharger':'Supercharger','18_compactor':'Compactor','19_milk':'Milk','23_hex':'Hex','24_task':'Task','mimic':'Mimic','teleporter':'Teleporter'};
const WAGON_ORDER=['01_storage','02_collector','03_conveyor','04_mag','05_cannon','06_carriage','07_crafter','08_transformer','09_slot','10_dynamite','11_miner','12_torpedo','13_turret','14_brake','15_ghost','16_tank','17_supercharger','18_compactor','19_milk','23_hex','24_task','mimic','teleporter'];
const EXP_ORDER=Object.keys(ASSETS.expansions);
const FLOW_EXP={'storage-pull':1,'storage-push':1,'front-pull':1}; // these generate arrows
const STORAGE_KEY='01_storage';
const N=13;
const ERASER=`<svg viewBox="0 0 24 24" fill="none"><path d="M4 16l8-8 6 6-5 5H7l-3-3z" fill="#c98a4a" stroke="#f6ecd9" stroke-width="1.4" stroke-linejoin="round"/><path d="M9 21h11" stroke="#f6ecd9" stroke-width="1.6" stroke-linecap="round"/></svg>`;

// ===== state =====
// slots index 0 = leftmost (rear) ... 12 = rightmost. FRONT = RIGHT.
let engine='steam';
let enginePos=N;            // gap index 0..N where engine sits. N = far right (front). Movable only for pusher.
let slots=Array.from({length:N},()=>({type:null,ext:[null,null,null]}));
let brush=null, sel=null, showAnim=true, showLabels=false, tab='wagon';

// ===== engine selector =====
const engsel=document.getElementById('engsel');
['steam','pusher','toy','ghost'].forEach(k=>{
  if(!ASSETS.engines[k])return;
  const d=document.createElement('div');d.className='engopt'+(k===engine?' on':'');
  d.innerHTML=`<img src="${ASSETS.engines[k]}">`+(k==='pusher'?'<span class="free">自由</span>':'');
  d.title=k;d.onclick=()=>{engine=k;if(k!=='pusher')enginePos=N;[...engsel.querySelectorAll('.engopt')].forEach(x=>x.classList.remove('on'));d.classList.add('on');renderTrain();};
  engsel.appendChild(d);
});

// ===== palette =====
const tray=document.getElementById('tray');
function eraserEl(){const er=document.createElement('div');er.className='pal-item eraser'+(brush&&brush.kind==='eraser'?' on':'');er.innerHTML=ERASER+`<span class="pn">消去 / Erase</span>`;er.onclick=()=>setBrush({kind:'eraser'});return er;}
function renderTray(){
  tray.innerHTML='';tray.appendChild(eraserEl());
  if(tab==='wagon'){
    WAGON_ORDER.forEach(k=>{if(!ASSETS.wagons[k])return;
      const d=document.createElement('div');d.className='pal-item'+(brush&&brush.kind==='wagon'&&brush.key===k?' on':'');
      d.innerHTML=`<img src="${ASSETS.wagons[k]}"><span class="pn">${WAGON_LABELS[k]||k}</span>`;
      d.onclick=()=>setBrush({kind:'wagon',key:k});tray.appendChild(d);});
  }else{
    EXP_ORDER.forEach(k=>{
      const d=document.createElement('div');d.className='pal-item'+(brush&&brush.kind==='ext'&&brush.key===k?' on':'');
      d.innerHTML=`<img src="${ASSETS.expansions[k]}"><span class="pn">${k}</span>`+(FLOW_EXP[k]?'<span class="flow">⚡</span>':'');
      d.onclick=()=>setBrush({kind:'ext',key:k});tray.appendChild(d);});
  }
}
function setBrush(b){brush=b;renderTray();renderBrushChip();}
function renderBrushChip(){const c=document.getElementById('brushChip');
  if(!brush){c.innerHTML='<span class="hint">パレットから選ぶ → スロットをクリック</span>';return;}
  if(brush.kind==='eraser')c.innerHTML=`<span class="sw">${ERASER}</span>消去 / Eraser`;
  else if(brush.kind==='wagon')c.innerHTML=`<span class="sw"><img src="${ASSETS.wagons[brush.key]}"></span>${WAGON_LABELS[brush.key]||brush.key}`;
  else c.innerHTML=`<span class="sw"><img src="${ASSETS.expansions[brush.key]}"></span>${brush.key}`;
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{tab=t.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));renderTray();});

// ===== board (engine on the RIGHT / front) =====
const train=document.getElementById('train');
function engineCell(){
  const ec=document.createElement('div');ec.className='engine-cell';
  const movable=engine==='pusher';
  ec.innerHTML=`<div class="epad"><img src="${ASSETS.engines[engine]}"></div>
    <div class="cap">ENGINE · ${engine}${enginePos===N?' <span class="front">(先頭/front)</span>':''}</div>
    <div class="mover${movable?'':' hidden'}">
      <button data-d="-1" ${enginePos<=0?'disabled':''}>◀</button>
      <button data-d="1" ${enginePos>=N?'disabled':''}>▶</button>
    </div>`;
  ec.querySelectorAll('.mover button').forEach(b=>b.onclick=()=>{enginePos=Math.max(0,Math.min(N,enginePos+ (+b.dataset.d)));renderTrain();});
  return ec;
}
function couplerEl(){const c=document.createElement('div');c.className='coupler';return c;}
function renderTrain(){
  train.innerHTML='';
  // build ordered element list left->right; insert engine at enginePos
  const items=[];
  for(let i=0;i<N;i++){ if(enginePos===i)items.push({t:'engine'}); items.push({t:'wagon',i}); }
  if(enginePos===N)items.push({t:'engine'});

  items.forEach((it,k)=>{
    if(k>0)train.appendChild(couplerEl());
    if(it.t==='engine'){train.appendChild(engineCell());return;}
    const i=it.i,s=slots[i];
    const cell=document.createElement('div');cell.className='wagon-cell';
    const wb=document.createElement('div');
    wb.className='wbox'+(s.type?' filled':'')+(sel&&sel.kind==='wagon'&&sel.i===i?' sel':'');
    const num=N-i; // #1 = front (right)
    wb.innerHTML=`<span class="idx">#${num}</span>`+(s.type?`<img src="${ASSETS.wagons[s.type]}">`:`<span class="empty-hint">+</span>`);
    wb.onclick=()=>clickWagon(i);cell.appendChild(wb);
    const nm=document.createElement('div');nm.className='wname';nm.textContent=s.type?(WAGON_LABELS[s.type]||s.type):'';cell.appendChild(nm);
    const er=document.createElement('div');er.className='ext-row';
    for(let e=0;e<3;e++){const es=document.createElement('div');const filled=!!s.ext[e];
      es.className='ext-slot'+(filled?' filled':'')+(sel&&sel.kind==='ext'&&sel.i===i&&sel.e===e?' sel':'')+(s.type?'':' disabled');
      es.innerHTML=filled?`<img src="${ASSETS.expansions[s.ext[e]]}">`:'';es.title=filled?s.ext[e]:'拡張スロット';
      es.onclick=(ev)=>{ev.stopPropagation();clickExt(i,e);};er.appendChild(es);}
    cell.appendChild(er);train.appendChild(cell);
  });
  requestAnimationFrame(drawArrows);
}
function clickWagon(i){
  if(brush&&brush.kind==='wagon'){slots[i].type=brush.key;sel={kind:'wagon',i};}
  else if(brush&&brush.kind==='eraser'){slots[i]={type:null,ext:[null,null,null]};sel=null;}
  else sel={kind:'wagon',i};
  renderTrain();
}
function clickExt(i,e){
  if(!slots[i].type){sel={kind:'wagon',i};renderTrain();return;}
  if(brush&&brush.kind==='ext'){slots[i].ext[e]=brush.key;sel={kind:'ext',i,e};}
  else if(brush&&brush.kind==='eraser'){slots[i].ext[e]=null;sel=null;}
  else sel={kind:'ext',i,e};
  renderTrain();
}

// ===== arrow logic (FRONT = RIGHT = higher index) =====
function computeArrows(){
  const arrows=[];const storageIdx=[];slots.forEach((s,i)=>{if(s.type===STORAGE_KEY)storageIdx.push(i);});
  function nearestStorage(i){let best=null,bd=1e9;
    for(const k of storageIdx){if(k===i)continue;const d=Math.abs(k-i);
      if(d<bd||(d===bd&&(best===null||k>best))){bd=d;best=k;}} // tie -> prefer front (right / larger index)
    return best;}
  slots.forEach((s,i)=>{if(!s.type)return;s.ext.forEach(e=>{if(!e)return;
    if(e==='front-pull'){let j=i+1;while(j<N&&!slots[j].type)j++; if(j<N)arrows.push({from:j,to:i,kind:'front'});} // pull from the RIGHT (front) wagon
    else if(e==='storage-pull'){const k=nearestStorage(i);if(k!==null)arrows.push({from:k,to:i,kind:'storage'});}
    else if(e==='storage-push'){const k=nearestStorage(i);if(k!==null)arrows.push({from:i,to:k,kind:'storage'});}
  });});
  return arrows;
}
function planArrows(arrows){
  const groups={};
  arrows.forEach(a=>{const lo=Math.min(a.from,a.to),hi=Math.max(a.from,a.to),key=lo+'-'+hi;
    if(!groups[key])groups[key]={lo,hi,fwd:false,bwd:false,kinds:new Set()};
    if(a.from<a.to)groups[key].fwd=true;else groups[key].bwd=true;groups[key].kinds.add(a.kind);});
  const planned=Object.values(groups).map(g=>({lo:g.lo,hi:g.hi,
    dir:g.fwd&&g.bwd?'both':(g.fwd?'fwd':'bwd'),
    kind:(g.kinds.has('front')&&g.kinds.size===1)?'front':'storage'}));
  planned.sort((a,b)=>a.lo-b.lo||a.hi-b.hi);
  const lanes=[];
  planned.forEach(p=>{let placed=false;
    for(let L=0;L<lanes.length;L++){const ov=lanes[L].some(([lo,hi])=>p.lo<hi&&lo<p.hi);
      if(!ov){lanes[L].push([p.lo,p.hi]);p.lane=L;placed=true;break;}}
    if(!placed){p.lane=lanes.length;lanes.push([[p.lo,p.hi]]);}});
  return planned;
}
const svg=document.getElementById('arrowSvg');const SVGNS='http://www.w3.org/2000/svg';
function wagonCenterX(i){const cells=train.querySelectorAll('.wagon-cell');const stage=document.querySelector('.stage');
  if(!cells[i])return null;const r=cells[i].querySelector('.wbox').getBoundingClientRect();const sr=stage.getBoundingClientRect();
  return r.left-sr.left+r.width/2;}
function getCSS(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function drawArrows(){
  svg.innerHTML='';const planned=planArrows(computeArrows());if(!planned.length)return;
  const H=150,baseY=H-6,laneGap=30;
  const defs=document.createElementNS(SVGNS,'defs');
  [['rail',getCSS('--rail')],['blue',getCSS('--blue')]].forEach(([c,col])=>{['end','start'].forEach(pos=>{
    const m=document.createElementNS(SVGNS,'marker');m.setAttribute('id',`mk-${c}-${pos}`);m.setAttribute('viewBox','0 0 10 10');
    m.setAttribute('refX',pos==='end'?'8':'2');m.setAttribute('refY','5');m.setAttribute('markerWidth','7');m.setAttribute('markerHeight','7');
    m.setAttribute('orient','auto-start-reverse');const p=document.createElementNS(SVGNS,'path');p.setAttribute('d','M0 0 L10 5 L0 10 z');p.setAttribute('fill',col);
    m.appendChild(p);defs.appendChild(m);});});
  svg.appendChild(defs);
  const labels=[];
  planned.forEach((p,idx)=>{
    const x1=wagonCenterX(p.lo),x2=wagonCenterX(p.hi);if(x1==null||x2==null)return;
    const apex=baseY-(p.lane+1)*laneGap;const col=p.kind==='front'?getCSS('--blue'):getCSS('--rail');const cN=p.kind==='front'?'blue':'rail';
    const path=document.createElementNS(SVGNS,'path');
    path.setAttribute('id',`arc-${idx}`);path.setAttribute('d',`M ${x1} ${baseY-6} C ${x1} ${apex}, ${x2} ${apex}, ${x2} ${baseY-6}`);
    path.setAttribute('fill','none');path.setAttribute('stroke',col);path.setAttribute('stroke-width','2.6');path.setAttribute('stroke-linecap','round');
    if(p.dir==='fwd'||p.dir==='both')path.setAttribute('marker-end',`url(#mk-${cN}-end)`);
    if(p.dir==='bwd'||p.dir==='both')path.setAttribute('marker-start',`url(#mk-${cN}-start)`);
    svg.appendChild(path);
    if(showLabels)labels.push({x:(x1+x2)/2,y:apex-4,col,text:p.dir==='both'?'⇄ '+p.kind:p.kind});
    if(showAnim){const mk=(reverse)=>{const img=document.createElementNS(SVGNS,'image');
      img.setAttribute('href',ASSETS.wood);img.setAttributeNS('http://www.w3.org/1999/xlink','href',ASSETS.wood);
      img.setAttribute('width','18');img.setAttribute('height','18');img.setAttribute('x','-9');img.setAttribute('y','-9');
      const am=document.createElementNS(SVGNS,'animateMotion');am.setAttribute('dur','2.2s');am.setAttribute('repeatCount','indefinite');
      if(reverse){am.setAttribute('keyPoints','1;0');am.setAttribute('keyTimes','0;1');am.setAttribute('calcMode','linear');}
      const mp=document.createElementNS(SVGNS,'mpath');mp.setAttribute('href',`#arc-${idx}`);mp.setAttributeNS('http://www.w3.org/1999/xlink','href',`#arc-${idx}`);
      am.appendChild(mp);img.appendChild(am);svg.appendChild(img);};
      if(p.dir==='fwd'||p.dir==='both')mk(false);
      if(p.dir==='bwd'||p.dir==='both')mk(true);}
  });
  // labels drawn LAST so they sit on top of arrows + moving cargo
  labels.forEach(l=>{
    const w=l.text.length*6.4+10;
    const bg=document.createElementNS(SVGNS,'rect');
    bg.setAttribute('x',l.x-w/2);bg.setAttribute('y',l.y-12);bg.setAttribute('width',w);bg.setAttribute('height',15);
    bg.setAttribute('rx','5');bg.setAttribute('fill','rgba(15,18,26,.82)');bg.setAttribute('stroke',l.col);bg.setAttribute('stroke-width','1');
    svg.appendChild(bg);
    const t=document.createElementNS(SVGNS,'text');t.setAttribute('x',l.x);t.setAttribute('y',l.y-1);
    t.setAttribute('fill',l.col);t.setAttribute('font-size','10');t.setAttribute('font-weight','800');t.setAttribute('text-anchor','middle');
    t.setAttribute('font-family',"'M PLUS Rounded 1c',sans-serif");t.textContent=l.text;svg.appendChild(t);
  });
}

// ===== toolbar =====
document.getElementById('animBtn').onclick=function(){showAnim=!showAnim;this.classList.toggle('on',showAnim);drawArrows();};
document.getElementById('labelBtn').onclick=function(){showLabels=!showLabels;this.classList.toggle('on',showLabels);drawArrows();};
document.getElementById('clearBtn').onclick=()=>{slots=Array.from({length:N},()=>({type:null,ext:[null,null,null]}));sel=null;renderTrain();};
document.getElementById('exportBtn').onclick=()=>{const data={engine,enginePos,slots};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='unrailed_build.json';a.click();};
document.getElementById('importBtn').onclick=()=>document.getElementById('fileIn').click();
document.getElementById('fileIn').onchange=function(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(d.engine)engine=d.engine;enginePos=(typeof d.enginePos==='number')?d.enginePos:N;if(engine!=='pusher')enginePos=N;
    if(Array.isArray(d.slots))slots=Array.from({length:N},(_,i)=>d.slots[i]?{type:d.slots[i].type||null,ext:(d.slots[i].ext||[null,null,null]).slice(0,3)}:{type:null,ext:[null,null,null]});
    [...engsel.querySelectorAll('.engopt')].forEach(x=>x.classList.toggle('on',x.title===engine));renderTrain();}catch(err){alert('読み込み失敗 / load failed');}};
  r.readAsText(f);};
window.addEventListener('resize',()=>drawArrows());
